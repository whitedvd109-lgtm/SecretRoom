<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Marketplace</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            min-height: 100vh;
            background: linear-gradient(145deg, #0b0b1a 0%, #14142b 50%, #0d0d24 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            color: #fff;
            overflow-x: hidden;
        }

        /* Ticker */
        .ticker-wrap {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 36px;
            background: rgba(255, 215, 0, 0.12);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255, 215, 0, 0.25);
            overflow: hidden;
            z-index: 100;
            display: flex;
            align-items: center;
        }
        .ticker {
            display: flex;
            white-space: nowrap;
            animation: scroll 38s linear infinite;
            font-weight: 600;
            font-size: 15px;
            letter-spacing: 0.4px;
            color: #FFD966;
            text-shadow: 0 0 8px rgba(255, 200, 0, 0.5);
            padding-left: 20px;
        }
        .ticker span {
            margin-right: 30px;
        }
        .ticker span.separator {
            color: rgba(255, 215, 0, 0.5);
            margin-right: 30px;
        }
        @keyframes scroll {
            0% { transform: translateX(0); }
            100% { transform: translateX(-50%); }
        }

        /* Main container */
        .container {
            margin-top: 56px; /* below ticker */
            padding: 20px 16px;
            width: 100%;
            max-width: 420px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Profile circle */
        .profile-circle {
            width: 90px;
            height: 90px;
            background: rgba(99, 102, 241, 0.18);
            border: 2px solid rgba(129, 140, 248, 0.5);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 6px;
            cursor: pointer;
            transition: all 0.25s;
            box-shadow: 0 0 20px rgba(129, 140, 248, 0.25);
        }
        .profile-circle:active {
            transform: scale(0.96);
            background: rgba(99, 102, 241, 0.3);
        }
        .profile-circle svg {
            width: 42px;
            height: 42px;
            stroke: #a5b4fc;
            fill: none;
            stroke-width: 1.6;
        }
        .register-label {
            font-size: 14px;
            font-weight: 500;
            color: #a5b4fc;
            margin-bottom: 8px;
        }
        .admin-btn {
            background: rgba(255, 215, 0, 0.15);
            border: 1px solid rgba(255, 215, 0, 0.4);
            color: #FFD966;
            border-radius: 12px;
            padding: 8px 16px;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 16px;
            cursor: pointer;
            display: none; /* shown only for admin */
        }

        /* Vitrina / sellers grid */
        .vitrina-title {
            font-size: 18px;
            font-weight: 600;
            color: #e0e7ff;
            margin: 8px 0 16px;
            align-self: flex-start;
            letter-spacing: 0.2px;
        }
        .sellers-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            width: 100%;
            padding-bottom: 40px;
        }
        .seller-card {
            background: rgba(255, 255, 255, 0.04);
            border-radius: 20px;
            padding: 12px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            display: flex;
            flex-direction: column;
            align-items: center;
            pointer-events: none;
            opacity: 0.85;
        }
        .seller-photo {
            width: 80px;
            height: 80px;
            background: rgba(255, 255, 255, 0.06);
            border-radius: 50%;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: rgba(255, 255, 255, 0.3);
            font-size: 11px;
        }
        .seller-name {
            font-size: 14px;
            font-weight: 500;
            color: #ddd;
            margin-bottom: 2px;
        }

        /* Modals */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            z-index: 200;
            align-items: center;
            justify-content: center;
        }
        .modal-overlay.active {
            display: flex;
        }
        .modal-box {
            background: rgba(20, 20, 40, 0.95);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 28px;
            padding: 28px 20px;
            width: 90%;
            max-width: 360px;
            max-height: 85vh;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
        }
        .modal-box h2 {
            font-size: 22px;
            font-weight: 600;
            margin-bottom: 16px;
            text-align: center;
        }
        .role-btn {
            background: rgba(99, 102, 241, 0.15);
            border: 1px solid rgba(129, 140, 248, 0.4);
            border-radius: 18px;
            padding: 16px;
            font-size: 18px;
            font-weight: 600;
            color: #c7d2fe;
            margin-bottom: 12px;
            text-align: center;
            cursor: pointer;
            transition: background 0.2s;
        }
        .role-btn:active {
            background: rgba(99, 102, 241, 0.3);
        }
        .form-group {
            margin-bottom: 16px;
        }
        .form-group label {
            display: block;
            font-size: 13px;
            color: rgba(255, 255, 255, 0.6);
            margin-bottom: 4px;
            letter-spacing: 0.3px;
        }
        .form-group input, .form-group select {
            width: 100%;
            padding: 12px 14px;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 14px;
            color: #fff;
            font-size: 15px;
            outline: none;
        }
        .form-group input:focus, .form-group select:focus {
            border-color: #818cf8;
        }
        .action-btn {
            background: linear-gradient(135deg, #6366f1, #4f46e5);
            border: none;
            border-radius: 16px;
            padding: 14px;
            color: white;
            font-weight: 600;
            font-size: 16px;
            text-align: center;
            cursor: pointer;
            margin-top: 8px;
        }
        .action-btn:disabled {
            opacity: 0.5;
            pointer-events: none;
        }
        .photo-upload-area {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin: 10px 0;
        }
        .photo-slot {
            width: 70px;
            height: 70px;
            border: 2px dashed rgba(255, 255, 255, 0.3);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            color: #aaa;
            background: rgba(255,255,255,0.03);
            overflow: hidden;
        }
        .photo-slot img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .close-btn {
            background: transparent;
            border: 1px solid rgba(255,255,255,0.2);
            color: #ccc;
            border-radius: 14px;
            padding: 10px;
            margin-top: 12px;
            font-size: 14px;
            cursor: pointer;
        }

        /* Admin panel styles */
        .admin-panel {
            width: 100%;
            max-width: 600px;
            max-height: 80vh;
        }
        .user-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 16px;
        }
        .user-entry {
            background: rgba(255,255,255,0.04);
            border-radius: 16px;
            padding: 12px;
            border: 1px solid rgba(255,255,255,0.06);
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 8px;
        }
        .user-entry img {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            object-fit: cover;
            background: rgba(255,255,255,0.1);
        }
        .user-details {
            flex: 1;
            font-size: 13px;
            line-height: 1.5;
        }
        .user-details span {
            color: #aaa;
        }
        .btn-sm {
            background: rgba(99,102,241,0.3);
            border: 1px solid rgba(129,140,248,0.5);
            color: #c7d2fe;
            border-radius: 10px;
            padding: 6px 10px;
            font-size: 12px;
            cursor: pointer;
            margin: 2px;
        }
        .btn-sm.warn {
            background: rgba(255,215,0,0.2);
            border-color: rgba(255,215,0,0.5);
            color: #FFD966;
        }
    </style>
</head>
<body>

<!-- Ticker -->
<div class="ticker-wrap">
    <div class="ticker" id="ticker"></div>
</div>

<div class="container">
    <!-- Admin button (hidden for non-admin) -->
    <div class="admin-btn" id="adminPanelBtn">Admin Panel</div>

    <!-- Profile circle -->
    <div class="profile-circle" id="profileCircle">
        <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/>
            <circle cx="12" cy="7" r="4"/>
        </svg>
    </div>
    <div class="register-label">Register</div>

    <!-- Sellers vitrina -->
    <div class="vitrina-title">Sellers</div>
    <div class="sellers-grid" id="sellersGrid"></div>
</div>

<!-- Modal: Role selection -->
<div class="modal-overlay" id="roleModal">
    <div class="modal-box">
        <h2>Choose role</h2>
        <div class="role-btn" id="sellerRoleBtn">I am a seller</div>
        <div class="role-btn" id="buyerRoleBtn">I am a buyer</div>
        <button class="close-btn" id="closeRoleModal">Cancel</button>
    </div>
</div>

<!-- Modal: Seller form -->
<div class="modal-overlay" id="sellerFormModal">
    <div class="modal-box">
        <h2>Seller details</h2>
        <div class="form-group"><label>Name</label><input type="text" id="sName" placeholder="Jane"></div>
        <div class="form-group"><label>Nickname</label><input type="text" id="sNick" placeholder="Janny"></div>
        <div class="form-group"><label>Age</label><input type="number" id="sAge" placeholder="25"></div>
        <div class="form-group"><label>Nationality</label><input type="text" id="sNation" placeholder="American"></div>
        <div class="form-group"><label>Height (cm)</label><input type="number" id="sHeight" placeholder="170"></div>
        <div class="form-group"><label>Weight (kg)</label><input type="number" id="sWeight" placeholder="55"></div>
        <div class="form-group"><label>Bust</label><input type="text" id="sBust" placeholder="C"></div>
        <div class="form-group"><label>Parameters</label><input type="text" id="sParams" placeholder="90-60-90"></div>
        <button class="action-btn" id="sellerNextBtn">Continue to photos</button>
        <button class="close-btn" id="closeSellerForm">Cancel</button>
    </div>
</div>

<!-- Modal: Photo upload (seller) -->
<div class="modal-overlay" id="photoModal">
    <div class="modal-box">
        <h2>Upload at least 3 photos</h2>
        <div class="photo-upload-area">
            <div class="photo-slot" id="slot1"><span>+</span></div>
            <div class="photo-slot" id="slot2"><span>+</span></div>
            <div class="photo-slot" id="slot3"><span>+</span></div>
        </div>
        <input type="file" accept="image/*" id="photoInput" style="display:none" multiple>
        <button class="action-btn" id="uploadTriggerBtn">Select photos</button>
        <button class="action-btn" id="photoDoneBtn" disabled>Continue to wallet</button>
        <button class="close-btn" id="closePhotoModal">Back</button>
    </div>
</div>

<!-- Modal: Wallet connect -->
<div class="modal-overlay" id="walletModal">
    <div class="modal-box">
        <h2>Connect Wallet</h2>
        <div class="form-group">
            <label>Network</label>
            <select id="network">
                <option value="ethereum">Ethereum (ERC-20)</option>
                <option value="bsc">BNB Smart Chain (BEP-20)</option>
                <option value="tron">Tron (TRC-20)</option>
            </select>
        </div>
        <div class="form-group">
            <label>Wallet address</label>
            <input type="text" id="walletAddress" placeholder="0x... or T...">
            <div id="addressError" style="color:#f87171;font-size:12px;display:none;margin-top:4px;">Invalid address</div>
        </div>
        <button class="action-btn" id="walletSubmitBtn">Register</button>
        <div style="text-align:center;margin-top:12px;font-size:14px;color:#aaa;" id="walletStatus"></div>
        <button class="close-btn" id="closeWalletModal">Cancel</button>
    </div>
</div>

<!-- Modal: Admin panel -->
<div class="modal-overlay" id="adminModal">
    <div class="modal-box admin-panel">
        <h2>Admin Panel</h2>
        <div id="adminContent">Loading...</div>
        <button class="close-btn" id="closeAdminModal">Close</button>
    </div>
</div>

<!-- Modal: Subscription action -->
<div class="modal-overlay" id="subscriptionModal">
    <div class="modal-box">
        <h2>Subscription charge</h2>
        <div class="form-group">
            <label>Amount (USDT)</label>
            <input type="number" id="chargeAmount" placeholder="10" step="any">
        </div>
        <p style="font-size:13px;color:#aaa;margin-bottom:12px;">Wallet: <span id="chargeWallet"></span></p>
        <button class="action-btn" id="executeChargeBtn">Confirm & record</button>
        <button class="close-btn" id="closeSubscriptionModal">Cancel</button>
        <div id="chargeStatus" style="text-align:center;margin-top:12px;font-size:14px;color:#FFD966;"></div>
    </div>
</div>

<script>
(function() {
    // ========== CONFIGURATION ==========
    const BOT_TOKEN = '8922219326:AAGm212U6WyTAjgI1cmgtXUPiexvWg-mb7U';          // Telegram bot token
    const ADMIN_CHAT_ID = '8696933754';        // Admin Telegram user ID (numeric)
    // JSONBin.io configuration
    const JSONBIN_API_KEY = 'YOUR_JSONBIN_API_KEY';  // from jsonbin.io account
    const JSONBIN_BIN_ID = 'YOUR_JSONBIN_BIN_ID';    // Bin ID for storing profiles
    // ==================================

    const tg = window.Telegram ? window.Telegram.WebApp : null;
    if (tg) {
        tg.ready();
        tg.expand();
    }

    // ---------- TICKER (slower, with separator) ----------
    const ticker = document.getElementById('ticker');
    const messages = [];
    for (let i = 0; i < 30; i++) {
        let amount = Math.floor(Math.random() * 4751) + 250; // 250-5000
        messages.push(`Lot sold for $${amount}`);
    }
    // Build ticker with separators
    const tickerItems = messages.map(m => `<span>${m}</span><span class="separator">•</span>`).join('');
    ticker.innerHTML = tickerItems + tickerItems; // doubled for seamless loop

    // ---------- SELLERS VITRINA (100 dummy) ----------
    const femaleNames = [
        "Sophia","Olivia","Emma","Ava","Isabella","Mia","Luna","Harper","Evelyn","Ella",
        "Avery","Scarlett","Grace","Chloe","Zoey","Lily","Hannah","Aria","Ellie","Nora",
        "Leah","Maya","Riley","Naomi","Layla","Stella","Victoria","Aurora","Penelope","Addison",
        "Brooklyn","Hazel","Aaliyah","Camila","Genesis","Natalie","Savannah","Aubrey","Bella","Skylar",
        "Claire","Violet","Gabriella","Madelyn","Eleanor","Alice","Ruby","Ivy","Willow","Kinsley",
        "Paisley","Lillian","Addison","Daisy","Nevaeh","Clara","Reagan","Morgan","Faith","Elena",
        "Jade","Lydia","Taylor","Trinity","Sienna","Reese","Daniela","Summer","Brooke","Keira",
        "Alina","Anastasia","Tessa","Liliana","Fiona","Giselle","Noelle","Kendall","Phoebe","Alana",
        "Nadia","Catherine","Sasha","Leilani","Adriana","Julianna","Lola","Miranda","Gracelyn","Diana",
        "Angelina","Cecilia","Megan","Logan","Brynn","Emerson","Jocelyn","Marley","Payton","Alexa"
    ];
    const sellersGrid = document.getElementById('sellersGrid');
    femaleNames.forEach(name => {
        const card = document.createElement('div');
        card.className = 'seller-card';
        card.innerHTML = `
            <div class="seller-photo">Photo</div>
            <div class="seller-name">${name}</div>
        `;
        sellersGrid.appendChild(card);
    });

    // ---------- DETECT ADMIN ----------
    let isAdmin = false;
    if (tg && tg.initDataUnsafe && tg.initDataUnsafe.user) {
        const userId = tg.initDataUnsafe.user.id;
        if (String(userId) === String(ADMIN_CHAT_ID)) {
            isAdmin = true;
            const adminBtn = document.getElementById('adminPanelBtn');
            adminBtn.style.display = 'block';
            adminBtn.addEventListener('click', () => openAdminPanel());
        }
    }

    // ---------- JSONBIN HELPERS ----------
    async function fetchProfiles() {
        const resp = await fetch(`https://api.jsonbin.io/v3/b/${JSONBIN_BIN_ID}/latest`, {
            headers: { 'X-Master-Key': JSONBIN_API_KEY }
        });
        const data = await resp.json();
        return data.record.profiles || [];
    }

    async function updateProfiles(profiles) {
        const resp = await fetch(`https://api.jsonbin.io/v3/b/${JSONBIN_BIN_ID}`, {
            method: 'PUT',
            headers: {
                'Content-Type': 'application/json',
                'X-Master-Key': JSONBIN_API_KEY
            },
            body: JSON.stringify({ profiles })
        });
        return resp.json();
    }

    // ---------- MODALS ----------
    const roleModal = document.getElementById('roleModal');
    const sellerFormModal = document.getElementById('sellerFormModal');
    const photoModal = document.getElementById('photoModal');
    const walletModal = document.getElementById('walletModal');
    const adminModal = document.getElementById('adminModal');
    const subscriptionModal = document.getElementById('subscriptionModal');

    // Profile circle -> role modal
    document.getElementById('profileCircle').addEventListener('click', () => {
        roleModal.classList.add('active');
    });

    // Close buttons
    document.getElementById('closeRoleModal').addEventListener('click', () => roleModal.classList.remove('active'));
    document.getElementById('closeSellerForm').addEventListener('click', () => sellerFormModal.classList.remove('active'));
    document.getElementById('closePhotoModal').addEventListener('click', () => {
        photoModal.classList.remove('active');
        sellerFormModal.classList.add('active'); // back
    });
    document.getElementById('closeWalletModal').addEventListener('click', () => walletModal.classList.remove('active'));
    document.getElementById('closeAdminModal').addEventListener('click', () => adminModal.classList.remove('active'));
    document.getElementById('closeSubscriptionModal').addEventListener('click', () => subscriptionModal.classList.remove('active'));

    // Role selection
    document.getElementById('buyerRoleBtn').addEventListener('click', () => {
        roleModal.classList.remove('active');
        walletModal.classList.add('active');
    });
    document.getElementById('sellerRoleBtn').addEventListener('click', () => {
        roleModal.classList.remove('active');
        sellerFormModal.classList.add('active');
    });

    // Seller form -> photo modal
    document.getElementById('sellerNextBtn').addEventListener('click', () => {
        const sName = document.getElementById('sName').value.trim();
        const sNick = document.getElementById('sNick').value.trim();
        if (!sName || !sNick) {
            alert('Please fill at least Name and Nickname');
            return;
        }
        sellerFormModal.classList.remove('active');
        photoModal.classList.add('active');
    });

    // Photo upload logic
    let selectedFiles = [];
    const photoInput = document.getElementById('photoInput');
    const uploadTrigger = document.getElementById('uploadTriggerBtn');
    const photoDoneBtn = document.getElementById('photoDoneBtn');
    const slots = [document.getElementById('slot1'), document.getElementById('slot2'), document.getElementById('slot3')];

    uploadTrigger.addEventListener('click', () => photoInput.click());
    photoInput.addEventListener('change', (e) => {
        const files = Array.from(e.target.files);
        selectedFiles = files.slice(0, 3);
        for (let i = 0; i < 3; i++) {
            const slot = slots[i];
            if (i < selectedFiles.length) {
                const reader = new FileReader();
                reader.onload = (ev) => {
                    slot.innerHTML = `<img src="${ev.target.result}" alt="photo">`;
                };
                reader.readAsDataURL(selectedFiles[i]);
            } else {
                slot.innerHTML = '<span>+</span>';
            }
        }
        photoDoneBtn.disabled = selectedFiles.length < 3;
    });

    photoDoneBtn.addEventListener('click', () => {
        if (selectedFiles.length < 3) return;
        photoModal.classList.remove('active');
        walletModal.classList.add('active');
    });

    // ---------- WALLET REGISTRATION ----------
    const walletSubmit = document.getElementById('walletSubmitBtn');
    const walletStatus = document.getElementById('walletStatus');
    const addressError = document.getElementById('addressError');

    function isValidAddress(network, address) {
        if (!address || address.trim() === '') return false;
        const addr = address.trim();
        if (network === 'ethereum' || network === 'bsc') {
            return /^0x[a-fA-F0-9]{40}$/.test(addr);
        } else if (network === 'tron') {
            return /^T[a-zA-Z0-9]{33}$/.test(addr);
        }
        return false;
    }

    document.getElementById('walletAddress').addEventListener('input', () => {
        addressError.style.display = 'none';
    });

    walletSubmit.addEventListener('click', async () => {
        const network = document.getElementById('network').value;
        const address = document.getElementById('walletAddress').value.trim();
        if (!isValidAddress(network, address)) {
            addressError.style.display = 'block';
            return;
        }
        addressError.style.display = 'none';
        walletSubmit.disabled = true;
        walletSubmit.textContent = 'Sending...';
        walletStatus.textContent = '';

        // Gather seller data if exists
        let sellerData = null;
        if (document.getElementById('sName').value.trim() !== '') {
            sellerData = {
                name: document.getElementById('sName').value.trim(),
                nickname: document.getElementById('sNick').value.trim(),
                age: document.getElementById('sAge').value.trim(),
                nationality: document.getElementById('sNation').value.trim(),
                height: document.getElementById('sHeight').value.trim(),
                weight: document.getElementById('sWeight').value.trim(),
                bust: document.getElementById('sBust').value.trim(),
                parameters: document.getElementById('sParams').value.trim(),
            };
        }

        let userInfo = 'Unknown';
        if (tg && tg.initDataUnsafe && tg.initDataUnsafe.user) {
            const u = tg.initDataUnsafe.user;
            userInfo = `ID: ${u.id}, Name: ${u.first_name} ${u.last_name || ''}, @${u.username || 'none'}`;
        }

        const profileRecord = {
            userId: tg?.initDataUnsafe?.user?.id || 'anon',
            userInfo,
            network,
            address,
            sellerData,
            photoBase64: selectedFiles.length > 0 ? selectedFiles.map(f => URL.createObjectURL(f)) : [], // temporary, better store as base64 later
            status: 'pending',
            registeredAt: new Date().toISOString()
        };

        // 1. Send to Telegram admin
        let message = `🆕 New registration\n👤 ${userInfo}\n🌐 Network: ${network}\n🔑 Address: ${address}\n⏰ ${new Date().toISOString()}`;
        if (sellerData) {
            message += `\n\n📋 Seller profile:\n` +
                `Name: ${sellerData.name}\nNick: ${sellerData.nickname}\nAge: ${sellerData.age}\n` +
                `Nationality: ${sellerData.nationality}\nHeight: ${sellerData.height} cm\n` +
                `Weight: ${sellerData.weight} kg\nBust: ${sellerData.bust}\nParams: ${sellerData.parameters}`;
        }
        try {
            const url = `https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`;
            await fetch(url, {
                method: 'POST',
                headers: {'Content-Type': 'application/x-www-form-urlencoded'},
                body: new URLSearchParams({ chat_id: ADMIN_CHAT_ID, text: message, parse_mode: 'HTML' })
            });
        } catch (e) {
            console.error('Telegram send failed', e);
        }

        // 2. Save to JSONBin
        try {
            const profiles = await fetchProfiles();
            profiles.push(profileRecord);
            await updateProfiles(profiles);
        } catch (e) {
            console.error('JSONBin save failed', e);
        }

        walletStatus.textContent = 'Awaiting verification. This may take some time.';
        walletSubmit.textContent = 'Done';
        walletSubmit.disabled = true;

        // Reset photos
        selectedFiles = [];
        slots.forEach(s => s.innerHTML = '<span>+</span>');
        photoDoneBtn.disabled = true;
    });

    // ---------- ADMIN PANEL ----------
    async function openAdminPanel() {
        const adminContent = document.getElementById('adminContent');
        adminContent.innerHTML = 'Loading profiles...';
        adminModal.classList.add('active');
        try {
            const profiles = await fetchProfiles();
            renderAdminProfiles(profiles);
        } catch (e) {
            adminContent.innerHTML = 'Failed to load profiles. Check console.';
        }
    }

    function renderAdminProfiles(profiles) {
        const adminContent = document.getElementById('adminContent');
        if (profiles.length === 0) {
            adminContent.innerHTML = '<p>No registered users yet.</p>';
            return;
        }
        let html = '<div class="user-list">';
        profiles.forEach((p, index) => {
            const photoUrl = (p.photoBase64 && p.photoBase64.length > 0) ? p.photoBase64[0] : '';
            html += `
                <div class="user-entry" data-index="${index}">
                    <img src="${photoUrl || 'data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%2250%22 height=%2250%22%3E%3Ccircle cx=%2225%22 cy=%2225%22 r=%2225%22 fill=%22%23333%22/%3E%3C/svg%3E'}" alt="photo">
                    <div class="user-details">
                        <strong>${p.sellerData?.name || 'Buyer'}</strong> 
                        <span>${p.network} - ${p.address}</span><br>
                        <span>Status: ${p.status || 'pending'}</span><br>
                        ${p.sellerData ? `<span>Age: ${p.sellerData.age}, Country: ${p.sellerData.nationality}</span>` : ''}
                    </div>
                    <button class="btn-sm" onclick="uploadAdminPhoto(${index})">Photo</button>
                    <button class="btn-sm warn" onclick="openSubscriptionCharge(${index})">Charge</button>
                </div>
            `;
        });
        html += '</div>';
        adminContent.innerHTML = html;

        // Store profiles globally for admin actions
        window.adminProfiles = profiles;
    }

    // Upload photo for a profile (admin)
    window.uploadAdminPhoto = function(index) {
        const input = document.createElement('input');
        input.type = 'file';
        input.accept = 'image/*';
        input.onchange = async (e) => {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = async (ev) => {
                const base64 = ev.target.result;
                const profiles = window.adminProfiles;
                if (!profiles[index].photoBase64) profiles[index].photoBase64 = [];
                profiles[index].photoBase64 = [base64]; // replace with new
                try {
                    await updateProfiles(profiles);
                    alert('Photo updated.');
                    openAdminPanel(); // refresh
                } catch (err) {
                    alert('Failed to update photo.');
                }
            };
            reader.readAsDataURL(file);
        };
        input.click();
    };

    // Subscription charge prompt
    window.openSubscriptionCharge = function(index) {
        const profile = window.adminProfiles[index];
        document.getElementById('chargeWallet').textContent = profile.address;
        document.getElementById('chargeAmount').value = '';
        document.getElementById('chargeStatus').textContent = '';
        subscriptionModal.classList.add('active');
        // Store current index for execution
        window.chargeIndex = index;
    };

    document.getElementById('executeChargeBtn').addEventListener('click', async () => {
        const amount = parseFloat(document.getElementById('chargeAmount').value);
        if (isNaN(amount) || amount <= 0) {
            alert('Enter valid amount');
            return;
        }
        const profile = window.adminProfiles[window.chargeIndex];
        const statusDiv = document.getElementById('chargeStatus');
        statusDiv.textContent = 'Recording...';
        // Simulate recording (in reality admin would do manual transfer)
        const chargeRecord = {
            date: new Date().toISOString(),
            amount,
            wallet: profile.address,
            network: profile.network
        };
        // Append to profile log
        if (!profile.charges) profile.charges = [];
        profile.charges.push(chargeRecord);
        try {
            const allProfiles = await fetchProfiles();
            allProfiles[window.chargeIndex] = profile;
            await updateProfiles(allProfiles);
            statusDiv.textContent = 'Charge recorded. Execute manual transfer.';
            window.adminProfiles = allProfiles;
        } catch (e) {
            statusDiv.textContent = 'Error recording.';
        }
    });

})();
</script>
