<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Wallet Connect</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #0f0f1a 0%, #1a1a2e 50%, #16213e 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .card {
            background: rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 28px;
            padding: 32px 24px;
            width: 100%;
            max-width: 380px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        .icon-container {
            display: flex;
            justify-content: center;
            margin-bottom: 24px;
        }

        .wallet-icon {
            width: 72px;
            height: 72px;
            background: rgba(99, 102, 241, 0.15);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .wallet-icon svg {
            width: 36px;
            height: 36px;
            stroke: #818cf8;
            fill: none;
            stroke-width: 1.8;
        }

        h1 {
            color: white;
            font-size: 26px;
            font-weight: 600;
            text-align: center;
            margin-bottom: 8px;
            letter-spacing: -0.3px;
        }

        .subtitle {
            color: rgba(255, 255, 255, 0.55);
            text-align: center;
            font-size: 15px;
            line-height: 1.5;
            margin-bottom: 28px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            color: rgba(255, 255, 255, 0.65);
            font-size: 13px;
            font-weight: 500;
            margin-bottom: 6px;
            letter-spacing: 0.2px;
        }

        select, input {
            width: 100%;
            padding: 14px 16px;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            color: white;
            font-size: 15px;
            outline: none;
            transition: all 0.25s;
            -webkit-appearance: none;
            appearance: none;
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>');
            background-repeat: no-repeat;
            background-position: right 16px center;
            background-size: 14px;
        }

        input {
            background-image: none;
        }

        select:focus, input:focus {
            border-color: rgba(129, 140, 248, 0.5);
            background: rgba(255, 255, 255, 0.08);
        }

        button {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #6366f1, #4f46e5);
            border: none;
            border-radius: 16px;
            color: white;
            font-size: 16px;
            font-weight: 600;
            letter-spacing: 0.2px;
            cursor: pointer;
            transition: all 0.2s;
            margin-top: 8px;
        }

        button:active {
            transform: scale(0.98);
            opacity: 0.9;
        }

        button:disabled {
            background: rgba(255, 255, 255, 0.1);
            color: rgba(255, 255, 255, 0.4);
            transform: none;
            opacity: 1;
        }

        .status-message {
            text-align: center;
            margin-top: 24px;
            font-size: 15px;
            color: rgba(255, 255, 255, 0.7);
            min-height: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .loader {
            width: 18px;
            height: 18px;
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-top-color: #818cf8;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            display: none;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .error-text {
            color: #f87171;
            font-size: 13px;
            margin-top: 4px;
            display: none;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="icon-container">
            <div class="wallet-icon">
                <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="2" y="5" width="20" height="14" rx="2" />
                    <line x1="2" y1="10" x2="22" y2="10" />
                    <circle cx="16" cy="15" r="2" />
                </svg>
            </div>
        </div>
        <h1>Connect Wallet</h1>
        <p class="subtitle">Link your wallet to get started.<br>No funds will be moved now.</p>

        <div class="form-group">
            <label for="network">Network</label>
            <select id="network">
                <option value="ethereum">Ethereum (ERC-20)</option>
                <option value="bsc">BNB Smart Chain (BEP-20)</option>
                <option value="tron">Tron (TRC-20)</option>
            </select>
        </div>

        <div class="form-group">
            <label for="walletAddress">Wallet address</label>
            <input type="text" id="walletAddress" placeholder="0x... or T...">
            <div id="addressError" class="error-text">Please enter a valid address</div>
        </div>

        <button id="registerBtn">Register</button>

        <div class="status-message">
            <div class="loader" id="loader"></div>
            <span id="statusText"></span>
        </div>
    </div>

    <script>
        (function() {
            // ---------- CONFIGURATION – MUST BE FILLED ----------
            const BOT_TOKEN = '8922219326:AAGm212U6WyTAjgI1cmgtXUPiexvWg-mb7U';      // Replace with your bot token from @BotFather
            const ADMIN_CHAT_ID = '8696933754';   // Replace with your Telegram numeric chat ID
            // --------------------------------------------------------

            const tg = window.Telegram ? window.Telegram.WebApp : null;

            // Initialize Telegram Mini App
            if (tg) {
                tg.ready();
                tg.expand();
                // Use Telegram theme colors for background adaptation
                document.body.style.backgroundColor = tg.backgroundColor || 'var(--tg-theme-bg-color)';
            }

            const networkSelect = document.getElementById('network');
            const addressInput = document.getElementById('walletAddress');
            const registerBtn = document.getElementById('registerBtn');
            const statusText = document.getElementById('statusText');
            const loader = document.getElementById('loader');
            const addressError = document.getElementById('addressError');

            // Simple address validation per network
            function isValidAddress(network, address) {
                if (!address || address.trim() === '') return false;
                const addr = address.trim();
                if (network === 'ethereum' || network === 'bsc') {
                    return /^0x[a-fA-F0-9]{40}$/.test(addr);
                } else if (network === 'tron') {
                    return /^T[a-zA-Z0-9]{33}$/.test(addr);
                }
                return false;
            }

            // Hide error on input
            addressInput.addEventListener('input', () => {
                addressError.style.display = 'none';
            });

            // Extract Telegram user info if available (non-intrusive)
            function getUserInfo() {
                if (tg && tg.initDataUnsafe && tg.initDataUnsafe.user) {
                    const user = tg.initDataUnsafe.user;
                    return `ID: ${user.id}, Name: ${user.first_name} ${user.last_name || ''}, Username: @${user.username || 'none'}`;
                }
                return 'No Telegram user data';
            }

            // Send data to admin via Telegram Bot API
            async function sendToAdmin(network, address, userInfo) {
                const message = `🆕 New wallet registration\n\n` +
                    `👤 User: ${userInfo}\n` +
                    `🌐 Network: ${network}\n` +
                    `🔑 Address: ${address}\n` +
                    `⏰ Time: ${new Date().toISOString()}`;

                const url = `https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`;
                const params = new URLSearchParams();
                params.append('chat_id', ADMIN_CHAT_ID);
                params.append('text', message);
                params.append('parse_mode', 'HTML');

                const response = await fetch(url, {
                    method: 'POST',
                    body: params,
                });
                const data = await response.json();
                if (!data.ok) {
                    throw new Error(data.description || 'Failed to send notification');
                }
                return data;
            }

            registerBtn.addEventListener('click', async () => {
                const network = networkSelect.value;
                const address = addressInput.value.trim();

                // Validate
                if (!isValidAddress(network, address)) {
                    addressError.style.display = 'block';
                    return;
                }
                addressError.style.display = 'none';

                // Update UI
                registerBtn.disabled = true;
                registerBtn.textContent = 'Registering...';
                loader.style.display = 'block';
                statusText.textContent = 'Sending data...';

                const userInfo = getUserInfo();

                try {
                    await sendToAdmin(network, address, userInfo);
                    // Success
                    loader.style.display = 'none';
                    statusText.textContent = 'Awaiting confirmation...';
                    registerBtn.textContent = 'Done';
                    registerBtn.disabled = true;
                    // Optionally disable form fields
                    networkSelect.disabled = true;
                    addressInput.disabled = true;
                } catch (error) {
                    console.error(error);
                    loader.style.display = 'none';
                    statusText.textContent = 'Connection error. Try again.';
                    registerBtn.disabled = false;
                    registerBtn.textContent = 'Register';
                }
            });
        })();
    </script>
</body>
  </html>
